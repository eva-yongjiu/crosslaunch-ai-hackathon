services:
  crosslaunch:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      CROSSLAUNCH_DATA_DIR: /app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:3000/api/status'),fetch('http://127.0.0.1:3000/')]).then(async ([api,html])=>process.exit(api.ok&&html.ok&&(await html.text()).includes('/_next/static/')?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - crosslaunch-data:/app/.data

volumes:
  crosslaunch-data:
