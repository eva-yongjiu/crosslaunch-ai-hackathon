services:
  crosslaunch:
    image: crosslaunch-ai:finale-20260911
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      CROSSLAUNCH_DATA_DIR: /app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - crosslaunch-data:/app/.data

volumes:
  crosslaunch-data:
